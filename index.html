<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Norm Free CRM</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#17202a;--muted:#718096;--line:#e6e9ee;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:var(--accent);color:#fff}.ghost{background:#eef0f5;color:var(--text)}.danger{background:#fee2e2;color:#991b1b}.app{display:flex;min-height:100vh}.side{width:235px;background:#111827;color:#d1d5db;padding:18px 12px;position:sticky;top:0;height:100vh}.logo{font-size:21px;font-weight:800;color:#fff;padding:8px 10px 20px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;margin:2px 0;padding:10px 12px}.nav button:hover,.nav .active{background:#253044;color:#fff}.main{flex:1;min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{padding:24px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 1px 2px #00000005}.stat{font-size:27px;font-weight:800;margin-top:5px}.muted{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.toolbar input,.form input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}.toolbar input{min-width:240px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:#eef0f4;border-radius:12px;padding:10px;min-height:230px}.task{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:105px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px}.modal{position:fixed;inset:0;background:#11182788;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal>div{background:#fff;border-radius:15px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}.form{display:grid;gap:10px}.form label{display:grid;gap:5px;font-size:13px}.row{display:flex;gap:8px;align-items:center}.right{margin-left:auto}.empty{text-align:center;padding:35px;color:var(--muted)}h1{margin:0 0 5px;font-size:26px}h2{font-size:17px;margin:0 0 12px}@media(max-width:900px){.side{width:70px}.logo{font-size:0}.logo:after{content:'N';font-size:21px}.nav button span{display:none}.grid{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:1fr}.content{padding:14px}}@media(max-width:600px){.grid{grid-template-columns:1fr}.toolbar input{width:100%;min-width:0}.side{width:58px;padding:10px 5px}}</style></head><body><div id="root"></div><script>const KEY='normfree-v1';const seed={contacts:[{id:1,name:'Анна Петрова',company:'Acme Studio',email:'anna@example.com',phone:'+48 600 111 222',tag:'клиент',note:'Редизайн сайта'}],projects:[{id:1,name:'Сайт Acme',client:'Анна Петрова',status:'В работе',budget:4200}],tasks:[{id:1,title:'Подготовить КП',project:'Сайт Acme',status:'В работе',due:'2026-09-15',priority:'Высокий'}],meetings:[{id:1,title:'Созвон с Анной',date:'2026-09-15',time:'14:00',client:'Анна Петрова'}],contracts:[{id:1,name:'Acme — дизайн',client:'Анна Петрова',amount:4200,status:'Активен'}],finance:[{id:1,type:'Доход',amount:4200,description:'Предоплата Acme',date:'2026-09-10'}],time:[],reminders:[]};let db=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(seed)),view='dashboard',q='',timer=null,timerStart=null;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(x=''){return String(x).replace(/[&<>\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function nav(){return [['dashboard','▦','Обзор'],['contacts','♙','Контакты'],['projects','◈','Проекты'],['tasks','✓','Задачи'],['calendar','□','Календарь'],['time','◷','Время'],['contracts','§','Договоры'],['finance','₽','Финансы'],['reports','▥','Отчёты'],['reminders','◌','Напоминания'],['settings','⚙','Настройки']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} <span>${x[2]}</span></button>`).join('')}function title(){return {dashboard:'Обзор',contacts:'Контакты',projects:'Проекты',tasks:'Задачи',calendar:'Календарь',time:'Тайм-трекер',contracts:'Договоры',finance:'Финансы',reports:'Отчёты',reminders:'Напоминания',settings:'Настройки'}[view]}function go(v){view=v;q='';layout()}function layout(){document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="logo">Norm Free</div><div class="nav">${nav()}</div></aside><main class="main"><header class="top"><b>${title()}</b><div class="row"><span class="muted">Локальный режим</span><button class="ghost" onclick="exportData()">Экспорт</button></div></header><section class="content" id="page"></section></main></div>`;render()}function render(){let p=document.getElementById('page');p.innerHTML=({dashboard,contacts,projects,tasks,calendar,timePage,contracts,finance,reports,reminders,settings}[view])()}function toolbar(label,fn){return `<div class="toolbar"><input placeholder="Поиск..." value="${esc(q)}" oninput="q=this.value;render()"><button onclick="${fn}">+ ${label}</button></div>`}function dashboard(){let inc=db.finance.filter(x=>x.type==='Доход').reduce((a,x)=>a+ +x.amount,0),out=db.finance.filter(x=>x.type==='Расход').reduce((a,x)=>a+ +x.amount,0);return `<h1>Добро пожаловать 👋</h1><div class=muted>Вся работа в одном месте — без подписки и сервера.</div><br><div class=grid><div class=card>Контакты<div class=stat>${db.contacts.length}</div></div><div class=card>Активные проекты<div class=stat>${db.projects.filter(x=>x.status!=='Завершён').length}</div></div><div class=card>Задачи<div class=stat>${db.tasks.filter(x=>x.status!=='Готово').length}</div></div><div class=card>Баланс<div class=stat>${(inc-out).toLocaleString()} ₽</div></div></div><br><div class=grid><div class=card style="grid-column:span 2"><h2>Сегодня</h2>${db.tasks.filter(x=>x.status!=='Готово').slice(0,5).map(t=>`<div class=row><span class=pill>${esc(t.priority)}</span><span>${esc(t.title)}</span><span class="right muted">${esc(t.due||'—')}</span></div>`).join('')||'<div class=empty>Задач нет</div>'}</div><div class=card style="grid-column:span 2"><h2>Быстрые действия</h2><div class=row><button onclick="modal('contact')">+ Контакт</button><button onclick="modal('project')">+ Проект</button><button onclick="modal('task')">+ Задача</button><button onclick="modal('meeting')">+ Встреча</button></div></div></div>`}function contacts(){let a=db.contacts.filter(x=>(x.name+x.company+x.email+x.tag).toLowerCase().includes(q.toLowerCase()));return `<h1>Контакты</h1>${toolbar('Контакт',"modal('contact')")}<div class=card><table class=table><tr><th>Имя</th><th>Компания</th><th>Связь</th><th>Теги</th><th></th></tr>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class=muted>${esc(x.note)}</span></td><td>${esc(x.company)}</td><td>${esc(x.email)}<br>${esc(x.phone)}</td><td><span class=pill>${esc(x.tag||'')}</span></td><td><button class=danger onclick="del('contacts',${x.id})">Удалить</button></td></tr>`).join('')||'<tr><td colspan=5 class=empty>Ничего не найдено</td></tr>'}</table></div>`}function projects(){return `<h1>Проекты</h1>${toolbar('Проект',"modal('project')")}<div class=grid>${db.projects.filter(x=>(x.name+x.client).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class=card><div class=row><h2>${esc(x.name)}</h2><span class="right pill">${esc(x.status)}</span></div><div class=muted>${esc(x.client)}</div><br><b>${(+x.budget||0).toLocaleString()} ₽</b><div class=row style="margin-top:12px"><button class=ghost onclick="modal('project',${x.id})">Изменить</button><button class=danger onclick="del('projects',${x.id})">Удалить</button></div></div>`).join('')||'<div class=empty>Проектов нет</div>'}</div>`}function tasks(){let cols=['Новая','В работе','Готово'];return `<h1>Задачи</h1>${toolbar('Задачу',"modal('task')")}<div class=kanban>${cols.map(c=>`<div class=col><b>${c}</b>${db.tasks.filter(x=>x.status===c&&(x.title+x.project).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class=task><b>${esc(x.title)}</b><div class=muted>${esc(x.project)} · ${esc(x.due||'')}</div><span class=pill>${esc(x.priority)}</span><div class=row style="margin-top:8px"><button class=ghost onclick="moveTask(${x.id})">→</button><button class=danger onclick="del('tasks',${x.id})">×</button></div></div>`).join('')}</div>`).join('')}</div>`}function moveTask(id){let x=db.tasks.find(x=>x.id===id),c=['Новая','В работе','Готово'];x.status=c[(c.indexOf(x.status)+1)%3];save();render()}function calendar(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate(),cells='';for(let i=1;i<=days;i++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;cells+=`<div class=day><b>${i}</b>${db.meetings.filter(x=>x.date===date).map(x=>`<div class=pill style="margin-top:6px">${esc(x.time)} ${esc(x.title)}</div>`).join('')}</div>`}return `<h1>Календарь</h1><div class=toolbar><button onclick="modal('meeting')">+ Встреча</button><span class=muted>${d.toLocaleString('ru-RU',{month:'long',year:'numeric'})}</span></div><div class=cal>${cells}</div>`}function timePage(){let total=db.time.reduce((a,x)=>a+x.minutes,0);return `<h1>Время</h1><div class=grid><div class=card><div class=muted>Всего записано</div><div class=stat>${Math.floor(total/60)} ч ${total%60} м</div></div><div class=card><div class=muted>Таймер</div><div class=stat id=clock>${timerStart?fmt(Date.now()-timerStart):'00:00:00'}</div><button onclick="toggleTimer()">${timerStart?'Остановить':'Запустить'}</button></div></div><br><div class=card><table class=table><tr><th>Дата</th><th>Контекст</th><th>Минуты</th></tr>${db.time.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.context)}</td><td>${x.minutes}</td></tr>`).join('')||'<tr><td colspan=3 class=empty>Записей пока нет</td></tr>'}</table></div>`}function fmt(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return[h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}function toggleTimer(){if(timerStart){let mins=Math.max(1,Math.round((Date.now()-timerStart)/60000));db.time.push({id:Date.now(),date:new Date().toISOString().slice(0,10),context:'Работа',minutes:mins});timerStart=null;clearInterval(timer);save();render()}else{timerStart=Date.now();timer=setInterval(()=>{let e=document.getElementById('clock');if(e)e.textContent=fmt(Date.now()-timerStart)},1000);render()}}function contracts(){return `<h1>Договоры</h1>${toolbar('Договор',"modal('contract')")}<div class=card><table class=table><tr><th>Договор</th><th>Клиент</th><th>Сумма</th><th>Статус</th><th></th></tr>${db.contracts.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.client)}</td><td>${(+x.amount).toLocaleString()} ₽</td><td><span class=pill>${esc(x.status)}</span></td><td><button class=danger onclick="del('contracts',${x.id})">Удалить</button></td></tr>`).join('')}</table></div>`}function finance(){let inc=db.finance.filter(x=>x.type==='Доход').reduce((a,x)=>a+ +x.amount,0),out=db.finance.filter(x=>x.type==='Расход').reduce((a,x)=>a+ +x.amount,0);return `<h1>Финансы</h1><div class=grid><div class=card>Доход<div class=stat>${inc.toLocaleString()} ₽</div></div><div class=card>Расход<div class=stat>${out.toLocaleString()} ₽</div></div><div class=card>Баланс<div class=stat>${(inc-out).toLocaleString()} ₽</div></div></div><br>${toolbar('Платёж',"modal('finance')")}<div class=card><table class=table><tr><th>Дата</th><th>Тип</th><th>Описание</th><th>Сумма</th><th></th></tr>${db.finance.map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${esc(x.description)}</td><td>${(+x.amount).toLocaleString()} ₽</td><td><button class=danger onclick="del('finance',${x.id})">×</button></td></tr>`).join('')}</table></div>`}function reports(){return `<h1>Отчёты</h1><div class=grid><div class=card>Контакты<div class=stat>${db.contacts.length}</div></div><div class=card>Проекты<div class=stat>${db.projects.length}</div></div><div class=card>Выполнено<div class=stat>${db.tasks.filter(x=>x.status==='Готово').length}</div></div><div class=card>Записей времени<div class=stat>${db.time.length}</div></div></div><br><div class=card><h2>Резервная копия</h2><p class=muted>Данные живут в этом браузере. Перед очисткой браузера экспортируй JSON.</p><button onclick=exportData()>Скачать JSON</button></div>`}function reminders(){return `<h1>Напоминания</h1>${toolbar('Напоминание',"modal('reminder')")}<div class=card><table class=table><tr><th>Дата</th><th>Текст</th><th>Статус</th><th></th></tr>${db.reminders.map(x=>`<tr><td>${x.date}</td><td>${esc(x.text)}</td><td><span class=pill>${x.done?'Выполнено':'Открыто'}</span></td><td><button class=ghost onclick="xDone(${x.id})">✓</button><button class=danger onclick="del('reminders',${x.id})">×</button></td></tr>`).join('')||'<tr><td colspan=4 class=empty>Напоминаний нет</td></tr>'}</table></div>`}function xDone(id){let x=db.reminders.find(x=>x.id===id);x.done=!x.done;save();render()}function settings(){return `<h1>Настройки</h1><div class=grid><div class=card><h2>Данные</h2><p class=muted>Локальное хранение через localStorage.</p><button onclick=exportData()>Экспорт JSON</button> <button class=ghost onclick="document.getElementById('file').click()">Импорт</button><input id=file type=file accept=.json hidden onchange=importData(this)></div><div class=card><h2>Безопасность</h2><p class=muted>Нет серверной авторизации. Не храни секреты и пароли.</p></div></div>`}function modal(type,id){let key={contact:'contacts',project:'projects',task:'tasks',meeting:'meetings',contract:'contracts',finance:'finance',reminder:'reminders'}[type],x=id?db[key].find(x=>x.id===id):{},fields={contact:[['name','Имя'],['company','Компания'],['email','Email'],['phone','Телефон'],['tag','Тег'],['note','Заметка']],project:[['name','Название'],['client','Клиент'],['status','Статус'],['budget','Бюджет']],task:[['title','Задача'],['project','Проект'],['status','Статус'],['due','Срок'],['priority','Приоритет']],meeting:[['title','Встреча'],['date','Дата'],['time','Время'],['client','Клиент']],contract:[['name','Название'],['client','Клиент'],['amount','Сумма'],['status','Статус']],finance:[['type','Тип'],['amount','Сумма'],['description','Описание'],['date','Дата']],reminder:[['date','Дата'],['text','Текст']}][type];let html=fields.map(f=>`<label>${f[1]}<input id=f_${f[0]} value="${esc(x[f[0]]||'')}" ${f[0]==='date'?'type=date':''}></label>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class=modal id=modal><div><h2>${id?'Изменить':'Новый'} объект</h2><form class=form onsubmit="event.preventDefault();saveModal('${type}',${id||0})">${html}<div class=row><button>Сохранить</button><button type=button class=ghost onclick="document.getElementById('modal').remove()">Отмена</button></div></form></div></div>`)}function saveModal(type,id){let key={contact:'contacts',project:'projects',task:'tasks',meeting:'meetings',contract:'contracts',finance:'finance',reminder:'reminders'}[type],fields={contact:['name','company','email','phone','tag','note'],project:['name','client','status','budget'],task:['title','project','status','due','priority'],meeting:['title','date','time','client'],contract:['name','client','amount','status'],finance:['type','amount','description','date'],reminder:['date','text']}[type],obj=id?db[key].find(x=>x.id===id):{id:Date.now()};fields.forEach(k=>obj[k]=document.getElementById('f_'+k).value);if(type==='task'&&!obj.status)obj.status='Новая';if(type==='project'&&!obj.status)obj.status='Новый';if(type==='contract'&&!obj.status)obj.status='Активен';if(type==='finance'&&!obj.type)obj.type='Доход';if(!id)db[key].push(obj);save();document.getElementById('modal').remove();render()}function del(key,id){if(confirm('Удалить запись?')){db[key]=db[key].filter(x=>x.id!==id);save();render()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='norm-free-backup.json';a.click()}function importData(i){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();layout()}catch(e){alert('Неверный JSON')}};r.readAsText(i.files[0])}layout();</script></body></html>
